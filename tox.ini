# Tox (http://tox.testrun.org/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# test suite on all supported python versions. To use it, "pip install tox"
# and then run "tox" from this directory.

[tox]
# Two sets of environments: combinations of Python versions with Django
# versions, then combinations of Python versions with Django REST Framework
# versions.
envlist =
    # Django 5.2 supports Python 3.11, 3.12, 3.13, 3.14.
    py{311,312,313,314}-django52,
    # Django 6.0 supports Python 3.12, 3.13, 3.14.
    py{312,313,314}-django60,
    # Django 6.1 supports Python 3.12, 3.13, 3.14, 3.15.
    py{312,313,314,315}-django61,
    # Django main supports Python 3.12, 3.13, 3.14, 3.15.
    py{312,313,314,315}-djangomain,
    # Django REST Framework 3.16 added support for Django 5.2 and Python 3.13.
    py{311,312,313}-django{52,main}-drf{316,main},
    # Only run a subset (LTS) against postgres.
    py313-django52-drf316-postgres
isolated_build = True
skip_missing_interpreters = True

[testenv]
commands =
    coverage run manage.py test
    coverage report
    coverage html
deps =
    coverage
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
    djangomain: https://codeload.github.com/django/django/zip/main
    drf316: djangorestframework>=3.16,<3.17
    drfmain: https://codeload.github.com/encode/django-rest-framework/zip/main
    postgres: psycopg2
setenv =
    postgres: POSTGRES_HOST=127.0.0.1
    postgres: POSTGRES_USER=postgres
    postgres: POSTGRES_PASSWORD=postgres
    postgres: POSTGRES_DATABASE=qss
